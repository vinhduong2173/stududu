server {
    listen 80;
    listen [::]:80;
    server_name api.stududu.io.vn;

    # Dung lượng tối đa cho upload avatar, audio, media
    client_max_body_size 25M;

    # File log cho backend
    access_log /var/log/nginx/stududu_api_access.log;
    error_log /var/log/nginx/stududu_api_error.log;

    # 1. Forward tất cả API requests về NestJS Backend (port 3001)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Forward WebSocket kết nối Socket.IO (Chat & Call Realtime)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Giữ kết nối socket không bị timeout ngắt kết nối
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
